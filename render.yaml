services:
  - type: web
    name: post-recommender
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: python post_recommender_service.py
    healthCheckPath: /health
    envVars:
      - key: POSTS_CSV_URL
        value: https://aqui-ta-bom-api.onrender.com/v1/api/postagens/csv
      - key: POSTS_POLL_INTERVAL
        value: "300"
      - key: PYTHON_VERSION
        value: 3.11.11
